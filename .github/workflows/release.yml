name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build release zip
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_release.ps1

      - name: Read version from the tag
        id: ver
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(.+)$') {
            throw "Tag '$tag' must start with v, for example v0.3.2"
          }
          $version = $Matches[1]
          $zip = "dist/TP-DECK-$version-windows-x64.zip"
          if (-not (Test-Path $zip)) {
            throw "Expected zip not found: $zip"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release $tag → $zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.ver.outputs.zip }}
          name: TP DECK ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          body: |
            Embeddable Python zip. Unzip and run `TP-DECK.bat`.

            Opening TP DECK starts Chromium minimized (first run needs network once to download it). Log into eBay Seller Hub and the ERP in that window once.
